# BetterMTA CI
#
# Directory-guarded jobs. Contracts always validate.
# Per-service test/build jobs no-op (success) when the directory is absent
# so this workflow stays green before parallel branches merge.

name: ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: contracts-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install contracts deps
        run: npm --prefix contracts ci
      - name: Validate schemas and fixtures
        run: npm --prefix contracts run validate

  api:
    name: apps-api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test and build (if present)
        run: |
          set -euo pipefail
          if [ ! -d apps/api ]; then
            echo "PLACEHOLDER: apps/api not present — skipping (awaiting backend merge)"
            exit 0
          fi

          # @bettermta/api consumes @bettermta/routing through a local file
          # dependency whose package entry points at dist/. Build it before
          # npm packages the dependency into apps/api/node_modules.
          if [ ! -d services/routing ]; then
            echo "services/routing is required by apps/api"
            exit 1
          fi
          if [ -f services/routing/package-lock.json ]; then
            npm --prefix services/routing ci
          else
            npm --prefix services/routing install
          fi
          npm --prefix services/routing run build

          if [ -f apps/api/package-lock.json ]; then
            npm --prefix apps/api ci
          else
            npm --prefix apps/api install
          fi
          if npm --prefix apps/api run | grep -qE '^  test'; then
            npm --prefix apps/api test
          else
            echo "No test script in apps/api"
          fi
          if npm --prefix apps/api run | grep -qE '^  build'; then
            npm --prefix apps/api run build
          else
            echo "No build script in apps/api"
          fi

  web:
    name: apps-web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test and build (if present)
        run: |
          set -euo pipefail
          if [ ! -d apps/web ]; then
            echo "PLACEHOLDER: apps/web not present — skipping (awaiting frontend merge)"
            exit 0
          fi
          if [ -f apps/web/package-lock.json ]; then
            npm --prefix apps/web ci
          else
            npm --prefix apps/web install
          fi
          if npm --prefix apps/web run | grep -qE '^  test'; then
            npm --prefix apps/web test
          else
            echo "No test script in apps/web"
          fi
          if npm --prefix apps/web run | grep -qE '^  build'; then
            npm --prefix apps/web run build
          else
            echo "No build script in apps/web"
          fi
      - name: Live build + verify no fixtures
        run: |
          set -euo pipefail
          if [ ! -d apps/web ]; then
            echo "PLACEHOLDER: apps/web not present — skipping live verify"
            exit 0
          fi
          if ! npm --prefix apps/web run | grep -qE '^  verify:no-fixtures'; then
            echo "No verify:no-fixtures script in apps/web — skipping"
            exit 0
          fi
          # Next does not guarantee deletion of unreferenced chunks when a
          # second build reuses .next. Remove the earlier fixture build output
          # so the live leak scan evaluates only live production artifacts.
          rm -rf apps/web/.next
          NEXT_PUBLIC_API_MODE=live \
          NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8080 \
          NEXT_PUBLIC_FLAG_FEEDBACK=false \
            npm --prefix apps/web run build
          npm --prefix apps/web run verify:no-fixtures

  public-beta-readiness:
    name: public-beta-readiness
    runs-on: ubuntu-latest
    env:
      ACCESSIBILITY_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            apps/web/package-lock.json
      - name: Install contract and web dependencies
        run: |
          npm --prefix contracts ci
          npm --prefix apps/web ci
      - name: Test readiness mechanics
        run: |
          node --test infra/public-beta/tests/public-beta-readiness.test.mjs
          node infra/public-beta/validate-readiness.mjs --structure-only
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Run mocked-live core-flow, mobile, keyboard, and accessibility checks
        run: npm --prefix apps/web run e2e
      - name: Write automated accessibility evidence
        run: |
          set -euo pipefail
          mkdir -p infra/public-beta/evidence/accessibility
          node infra/public-beta/write-accessibility-evidence.mjs \
            --release-commit "$ACCESSIBILITY_RELEASE_COMMIT" \
            --suite-status pass \
            > infra/public-beta/evidence/accessibility/result.json
      - name: Retain automated accessibility evidence
        uses: actions/upload-artifact@v7
        with:
          name: public-beta-accessibility-${{ github.run_id }}
          path: infra/public-beta/evidence/accessibility/result.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain Playwright failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: public-beta-playwright-${{ github.run_id }}
          path: apps/web/test-results
          if-no-files-found: ignore
          retention-days: 14

  public-beta-preview:
    name: public-beta-preview
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PREVIEW_RELEASE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      PREVIEW_IMAGE: bettermta-preview:${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            contracts/package-lock.json
            apps/web/package-lock.json
      - name: Install contract and web test dependencies
        run: |
          npm --prefix contracts ci
          npm --prefix apps/web ci
      - name: Install Playwright Chromium
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Build the production web container
        run: |
          docker build \
            --file apps/web/Dockerfile \
            --build-arg NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:3999 \
            --build-arg NEXT_PUBLIC_API_MODE=live \
            --build-arg NEXT_PUBLIC_FLAG_FEEDBACK=false \
            --build-arg NEXT_PUBLIC_FLAG_ADDRESS_POI=false \
            --tag "$PREVIEW_IMAGE" \
            .
      - name: Start the runner-local preview
        run: |
          set -euo pipefail
          docker run \
            --detach \
            --name bettermta-preview \
            --publish 127.0.0.1:3100:3000 \
            "$PREVIEW_IMAGE"
          for attempt in {1..60}; do
            if curl --fail --silent --show-error --output /dev/null http://127.0.0.1:3100/; then
              echo "Runner-local preview is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Runner-local preview did not become ready" >&2
          exit 1
      - name: Run mocked-live checks against the production container
        env:
          BETTERMTA_E2E_EXTERNAL_BASE: http://127.0.0.1:3100
        run: npm --prefix apps/web run e2e
      - name: Write commit-bound preview evidence
        run: |
          set -euo pipefail
          mkdir -p infra/public-beta/evidence/preview
          image_id="$(docker image inspect --format '{{.Id}}' "$PREVIEW_IMAGE")"
          node infra/public-beta/write-preview-evidence.mjs \
            --release-commit "$PREVIEW_RELEASE_COMMIT" \
            --image-id "$image_id" \
            --smoke-status pass \
            > infra/public-beta/evidence/preview/result.json
      - name: Retain preview evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: public-beta-preview-${{ github.run_id }}
          path: |
            infra/public-beta/evidence/preview/result.json
            apps/web/test-results
          if-no-files-found: warn
          retention-days: 14
      - name: Remove the runner-local preview
        if: always()
        run: |
          docker rm --force bettermta-preview >/dev/null 2>&1 || true
          docker image rm "$PREVIEW_IMAGE" >/dev/null 2>&1 || true

  routing:
    name: services-routing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test and build (if present)
        run: |
          set -euo pipefail
          if [ ! -d services/routing ]; then
            echo "PLACEHOLDER: services/routing not present — skipping (awaiting routing merge)"
            exit 0
          fi

          # Schema tests intentionally validate against conductor-owned
          # contracts and therefore require the contracts Ajv installation.
          npm --prefix contracts ci

          if [ -f services/routing/package-lock.json ]; then
            npm --prefix services/routing ci
          else
            npm --prefix services/routing install
          fi
          if npm --prefix services/routing run | grep -qE '^  test'; then
            npm --prefix services/routing test
          else
            echo "No test script in services/routing"
          fi
          if npm --prefix services/routing run | grep -qE '^  build'; then
            npm --prefix services/routing run build
          else
            echo "No build script in services/routing"
          fi

  data:
    name: services-data
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Test and build (if present)
        run: |
          set -euo pipefail
          if [ ! -d services/data ]; then
            echo "PLACEHOLDER: services/data not present — skipping (awaiting data merge)"
            exit 0
          fi

          # Schema tests intentionally validate against conductor-owned
          # contracts and therefore require the contracts Ajv installation.
          npm --prefix contracts ci

          if [ -f services/data/package-lock.json ]; then
            npm --prefix services/data ci
          else
            npm --prefix services/data install
          fi
          if npm --prefix services/data run | grep -qE '^  test'; then
            npm --prefix services/data test
          else
            echo "No test script in services/data"
          fi
          if npm --prefix services/data run | grep -qE '^  build'; then
            npm --prefix services/data run build
          else
            echo "No build script in services/data"
          fi

  benchmarks:
    name: benchmarks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Run benchmarks (if present)
        run: |
          set -euo pipefail
          if [ ! -f benchmarks/runner/package.json ]; then
            echo "PLACEHOLDER: benchmarks/runner not present — skipping (awaiting QA merge)"
            exit 0
          fi
          if [ -f benchmarks/runner/package-lock.json ]; then
            npm --prefix benchmarks/runner ci
          else
            npm --prefix benchmarks/runner install
          fi
          npm --prefix benchmarks/runner run validate-cases
          npm --prefix benchmarks/runner run self-test
          npm --prefix benchmarks/runner run gate
          if npm --prefix benchmarks/runner run | grep -qE '^  run-benchmarks'; then
            npm --prefix benchmarks/runner run run-benchmarks
          fi

  audit:
    name: dependency-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Audit contracts (always)
        run: |
          npm --prefix contracts install --package-lock-only=false
          npm --prefix contracts audit --audit-level=high || {
            echo "::warning::npm audit reported high+ issues in contracts — review before release"
            npm --prefix contracts audit --audit-level=high || true
          }
      - name: Audit present application packages
        run: |
          set -euo pipefail
          for dir in apps/api apps/web services/routing services/data benchmarks; do
            if [ -f "$dir/package.json" ]; then
              echo "Auditing $dir"
              if [ -f "$dir/package-lock.json" ]; then
                npm --prefix "$dir" ci
              else
                npm --prefix "$dir" install
              fi
              npm --prefix "$dir" audit --audit-level=high || {
                echo "::warning::npm audit high+ issues in $dir"
                true
              }
            else
              echo "PLACEHOLDER: skip audit — $dir missing"
            fi
          done

  infra-validate:
    name: infra-config-validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: contracts/package-lock.json
      - name: Install contracts deps (js-yaml)
        run: npm --prefix contracts ci
      - name: Validate workflow YAML and infra JSON
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require("fs");
          const path = require("path");
          const yaml = require("./contracts/node_modules/js-yaml");

          function walk(dir, acc = []) {
            if (!fs.existsSync(dir)) return acc;
            for (const ent of fs.readdirSync(dir, { withFileTypes: true })) {
              const p = path.join(dir, ent.name);
              if (ent.isDirectory()) walk(p, acc);
              else acc.push(p);
            }
            return acc;
          }

          const yamlFiles = [
            ...walk(".github/workflows").filter((f) => f.endsWith(".yml") || f.endsWith(".yaml")),
            ...walk("infra").filter((f) => f.endsWith(".yml") || f.endsWith(".yaml")),
          ];
          for (const f of yamlFiles) {
            yaml.load(fs.readFileSync(f, "utf8"));
            console.log("YAML OK:", f);
          }

          const jsonFiles = walk("infra").filter((f) => f.endsWith(".json"));
          for (const f of jsonFiles) {
            JSON.parse(fs.readFileSync(f, "utf8"));
            console.log("JSON OK:", f);
          }
          NODE
      - name: Validate Fly toml configs
        run: |
          set -euo pipefail
          python3 -c '
          import pathlib
          import tomllib
          root = pathlib.Path("infra/fly")
          files = sorted(root.glob("*.toml"))
          if not files:
              raise SystemExit("No infra/fly/*.toml files found")
          for path in files:
              tomllib.loads(path.read_text(encoding="utf-8"))
              print("TOML OK:", path)
          '
      - name: Test Fly operator scripts
        run: ./infra/fly/tests/operator-scripts.test.sh
