# Deploy workflow — workflow_dispatch only (never on push/PR).
#
# Phase 8 status: prepared, not activated.
# - Dockerfiles exist at apps/api, apps/web, services/data, services/otp
# - Fly apps / FLY_API_TOKEN are NOT provisioned in this environment
# - Refuses unless confirm_placeholder=ACTIVATE AND FLY_API_TOKEN is set
# - Fail closed on missing secrets, missing public API URL, or health gate failure

name: deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment label (documentation only until wired)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      confirm_placeholder:
        description: "Type ACTIVATE only when Fly apps + FLY_API_TOKEN are ready"
        required: true
        default: "NO"
        type: string
      public_api_base_url:
        description: "Public API origin baked into web (NEXT_PUBLIC_API_BASE_URL). Required; must not be localhost."
        required: true
        type: string
      skip_otp:
        description: "Skip OTP deploy (graph volume not ready)"
        required: false
        default: false
        type: boolean

jobs:
  deploy-fly:
    name: deploy-fly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse unless explicitly activated
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_placeholder }}" != "ACTIVATE" ]; then
            echo "Deploy workflow — refusing run (confirm_placeholder != ACTIVATE)."
            echo "Phase 8: prepared, not activated. Requires flyctl auth + app creation."
            exit 1
          fi

      - name: Require service Dockerfiles
        run: |
          set -euo pipefail
          missing=0
          for f in \
            apps/api/Dockerfile \
            apps/web/Dockerfile \
            services/data/Dockerfile \
            services/otp/Dockerfile \
            infra/fly/api.fly.toml \
            infra/fly/web.fly.toml \
            infra/fly/data.fly.toml \
            infra/fly/otp.fly.toml \
            infra/flags/flags.json
          do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Fail closed: deploy artifacts incomplete."
            exit 1
          fi

      - name: Require non-localhost public API URL (web bake-time)
        env:
          PUBLIC_API_BASE_URL: ${{ inputs.public_api_base_url }}
        run: |
          set -euo pipefail
          url="${PUBLIC_API_BASE_URL:-}"
          if [ -z "$url" ]; then
            echo "Fail closed: public_api_base_url input is required."
            echo "NEXT_PUBLIC_API_BASE_URL is baked at image build; localhost default must not ship to Fly."
            exit 1
          fi
          case "$url" in
            http://localhost*|https://localhost*|http://127.0.0.1*|https://127.0.0.1*)
              echo "Fail closed: public_api_base_url must not be localhost/127.0.0.1 (got: $url)."
              exit 1
              ;;
          esac
          case "$url" in
            http://*|https://*) ;;
            *)
              echo "Fail closed: public_api_base_url must start with http:// or https:// (got: $url)."
              exit 1
              ;;
          esac
          echo "Web will bake NEXT_PUBLIC_API_BASE_URL=${url}"

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy services + health gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SKIP_OTP: ${{ inputs.skip_otp }}
          TARGET_ENV: ${{ inputs.environment }}
          PUBLIC_API_BASE_URL: ${{ inputs.public_api_base_url }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "Fail closed: FLY_API_TOKEN secret not configured."
            echo "Phase 8 cloud deploy remains BLOCKED until Fly credentials exist."
            exit 1
          fi

          echo "Deploying environment=${TARGET_ENV}"

          flyctl deploy -a bettermta-data -c infra/fly/data.fly.toml
          if [ "${SKIP_OTP}" != "true" ]; then
            # Context = services/otp so Dockerfile COPY config/ + docker/ resolve
            # (compose uses the same context). --config path is relative to context.
            flyctl deploy services/otp -a bettermta-otp -c ../infra/fly/otp.fly.toml
          else
            echo "Skipping OTP deploy (skip_otp=true)"
          fi
          flyctl deploy -a bettermta-api -c infra/fly/api.fly.toml
          flyctl deploy -a bettermta-web -c infra/fly/web.fly.toml \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL}"

          API_HOST="${BETTERMTA_API_HOST:-}"
          if [ -z "${API_HOST}" ]; then
            API_HOST="$(flyctl info -a bettermta-api --json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("Hostname",""))' || true)"
          fi
          if [ -z "${API_HOST}" ]; then
            echo "Fail closed: could not resolve API hostname for health gate."
            exit 1
          fi

          echo "Health gate against https://${API_HOST}"
          curl -fsS "https://${API_HOST}/health/live"
          curl -fsS "https://${API_HOST}/health/ready"
          curl -fsS "https://${API_HOST}/v1/status" >/dev/null

          echo "Deploy + health gate OK."
          echo "On failure operators rollback:"
          echo "  flyctl releases rollback -a bettermta-api"
