# Deploy workflow — workflow_dispatch only (never on push/PR).
#
# Phase 8 status: prepared, not activated.
# - Dockerfiles exist at apps/api, apps/web, services/data, services/otp
# - Fly apps / FLY_API_TOKEN are NOT provisioned in this environment
# - Refuses unless confirm_placeholder=ACTIVATE AND FLY_API_TOKEN is set
# - Fail closed on missing secrets, missing public API URL, or health gate failure

name: deploy

permissions:
  contents: read

concurrency:
  group: deploy-fly-${{ inputs.environment }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment label (documentation only until wired)"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      confirm_placeholder:
        description: "Type ACTIVATE only when Fly apps + FLY_API_TOKEN are ready"
        required: true
        default: "NO"
        type: string
      public_api_base_url:
        description: "Public HTTPS API origin baked into web (NEXT_PUBLIC_API_BASE_URL). Required; must not be localhost."
        required: true
        type: string
      skip_otp:
        description: "Skip OTP deploy (graph volume not ready)"
        required: false
        default: false
        type: boolean
      initial_activation:
        description: "Allow deploy without a pre-existing four-app rollback set. Use only for the first staging/production activation."
        required: false
        default: false
        type: boolean

jobs:
  deploy-fly:
    name: deploy-fly
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Refuse unless explicitly activated
        run: |
          set -euo pipefail
          if [ "${{ inputs.confirm_placeholder }}" != "ACTIVATE" ]; then
            echo "Deploy workflow — refusing run (confirm_placeholder != ACTIVATE)."
            echo "Phase 8: prepared, not activated. Requires flyctl auth + app creation."
            exit 1
          fi
          if [ "${{ inputs.environment }}" = "production" ] && [ "${{ inputs.skip_otp }}" = "true" ]; then
            echo "Fail closed: production deploys may not skip OTP."
            exit 1
          fi

      - name: Require service Dockerfiles
        run: |
          set -euo pipefail
          missing=0
          for f in \
            apps/api/Dockerfile \
            apps/web/Dockerfile \
            services/data/Dockerfile \
            services/otp/Dockerfile \
            infra/fly/api.fly.toml \
            infra/fly/web.fly.toml \
            infra/fly/data.fly.toml \
            infra/fly/otp.fly.toml \
            infra/flags/flags.json
          do
            if [ ! -f "$f" ]; then
              echo "Missing required file: $f"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Fail closed: deploy artifacts incomplete."
            exit 1
          fi
          ./infra/fly/scripts/preflight-private-beta.sh --local-only

      - name: Require non-localhost public API URL (web bake-time)
        env:
          PUBLIC_API_BASE_URL: ${{ inputs.public_api_base_url }}
        run: |
          set -euo pipefail
          url="${PUBLIC_API_BASE_URL:-}"
          if [ -z "$url" ]; then
            echo "Fail closed: public_api_base_url input is required."
            echo "NEXT_PUBLIC_API_BASE_URL is baked at image build; localhost default must not ship to Fly."
            exit 1
          fi
          ./infra/fly/scripts/validate-public-origin.sh PUBLIC_API_BASE_URL "$url"
          echo "Web public API origin validated for bake-time use."

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master verified 2026-08-04

      - name: Capture pre-deploy rollback set
        id: rollback_set
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          INITIAL_ACTIVATION: ${{ inputs.initial_activation }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "Fail closed: FLY_API_TOKEN secret not configured."
            exit 1
          fi
          if [ "${INITIAL_ACTIVATION}" = "true" ]; then
            ./infra/fly/scripts/preflight-private-beta.sh --initial-activation
          else
            ./infra/fly/scripts/preflight-private-beta.sh --require-rollback-target
          fi
          output="${RUNNER_TEMP}/bettermta-fly-rollback-${GITHUB_RUN_ID}.json"
          if ./infra/fly/scripts/capture-rollback-manifest.sh --output "$output"; then
            echo "captured=true" >> "$GITHUB_OUTPUT"
            echo "path=$output" >> "$GITHUB_OUTPUT"
          elif [ "${INITIAL_ACTIVATION}" = "true" ]; then
            echo "Initial activation explicitly allowed: no pre-deploy rollback set exists."
            echo "captured=false" >> "$GITHUB_OUTPUT"
          else
            echo "Fail closed: no compatible pre-deploy rollback set was captured."
            echo "Use initial_activation only for the actual first activation."
            exit 1
          fi

      - name: Retain pre-deploy rollback set
        if: steps.rollback_set.outputs.captured == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: fly-rollback-set-${{ github.run_id }}
          path: ${{ steps.rollback_set.outputs.path }}
          if-no-files-found: error
          retention-days: 30

      - name: Deploy services + health gate
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SKIP_OTP: ${{ inputs.skip_otp }}
          TARGET_ENV: ${{ inputs.environment }}
          PUBLIC_API_BASE_URL: ${{ inputs.public_api_base_url }}
        run: |
          set -euo pipefail
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo "Fail closed: FLY_API_TOKEN secret not configured."
            echo "Phase 8 cloud deploy remains BLOCKED until Fly credentials exist."
            exit 1
          fi

          echo "Deploying environment=${TARGET_ENV}"

          flyctl deploy -a bettermta-data -c infra/fly/data.fly.toml \
            --image-label "$GITHUB_SHA" \
            --ha=false --strategy rolling --yes
          if [ "${SKIP_OTP}" != "true" ]; then
            # Context = services/otp so Dockerfile COPY config/ + docker/ resolve
            # (compose uses the same context). --config path is relative to context.
            flyctl deploy services/otp -a bettermta-otp -c ../infra/fly/otp.fly.toml \
              --image-label "$GITHUB_SHA" \
              --ha=false --strategy rolling --yes
          else
            echo "Skipping OTP deploy (skip_otp=true)"
          fi
          flyctl deploy -a bettermta-api -c infra/fly/api.fly.toml \
            --image-label "$GITHUB_SHA" \
            --ha=false --strategy rolling --yes
          flyctl deploy -a bettermta-web -c infra/fly/web.fly.toml \
            --image-label "$GITHUB_SHA" \
            --ha=false --strategy rolling --yes \
            --build-arg "NEXT_PUBLIC_API_BASE_URL=${PUBLIC_API_BASE_URL}"

          # Recheck exact one-Machine caps, required secrets/volumes, and a
          # retained image target after Fly has converged the four services.
          ./infra/fly/scripts/preflight-private-beta.sh --require-rollback-target

          API_HOST="${BETTERMTA_API_HOST:-}"
          if [ -z "${API_HOST}" ]; then
            API_HOST="$(flyctl info -a bettermta-api --json | python3 -c 'import json,sys; print(json.load(sys.stdin).get("Hostname",""))' || true)"
          fi
          if [ -z "${API_HOST}" ]; then
            echo "Fail closed: could not resolve API hostname for health gate."
            exit 1
          fi

          echo "Running API health gate."
          probe_api() {
            local label="$1"
            local path="$2"
            if ! curl -fs -o /dev/null "https://${API_HOST}${path}" >/dev/null 2>&1; then
              echo "Fail closed: API ${label} check failed."
              exit 1
            fi
          }
          probe_api "liveness" "/health/live"
          probe_api "readiness" "/health/ready"
          probe_api "status" "/v1/status"

          echo "Deploy + health gate OK."
          echo "On failure, download the fly-rollback-set-${GITHUB_RUN_ID} artifact and run:"
          echo "  ./infra/fly/scripts/rollback-private-beta.sh --manifest <downloaded-json> --execute"
