# BetterMTA controlled-alpha override (Phase 12A.3 — ADR-0021)
#
# Adds a loopback-only edge proxy and removes LAN-published data/OTP ports.
# Local-dev without this file keeps the root docker-compose.yml port map.
#
# Bring-up:
#   docker-compose -f docker-compose.yml -f docker-compose.alpha.yml build
#   docker-compose -f docker-compose.yml -f docker-compose.alpha.yml up -d
#
# Edge origin (Tunnel target later): http://127.0.0.1:8088
# Smoke: infra/alpha/scripts/smoke-edge.sh

services:
  # Internal-only: no host publish for data (8081/8082) or OTP GraphQL/debug.
  data:
    ports: !reset []

  otp:
    ports: !reset []

  # Loopback-only debug bindings (not 0.0.0.0). Prefer edge :8088 for clients.
  api:
    ports: !override
      - "127.0.0.1:8080:8080"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_MODE: live
        # Empty → same-origin relative /v1/* through the edge (not localhost:8080).
        NEXT_PUBLIC_API_BASE_URL: ""
        NEXT_PUBLIC_FLAG_FEEDBACK: "false"
    ports: !override
      - "127.0.0.1:3000:3000"

  edge:
    image: caddy:2.9.1-alpine@sha256:b4e3952384eb9524a887633ce65c752dd7c71314d2c2acf98cd5c715aaa534f0
    ports:
      - "127.0.0.1:8088:8088"
    volumes:
      - ./infra/alpha/Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O /dev/null http://127.0.0.1:8088/health/live || exit 1",
        ]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
