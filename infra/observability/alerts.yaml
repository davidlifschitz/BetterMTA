# Portable alert rules (PLACEHOLDER — not yet loaded into a manager)
#
# Intended for Prometheus / Grafana / compatible rule evaluators.
# Thresholds align with DATA_CONTRACT + ACCEPTANCE_CRITERIA.

groups:
  - name: bettermta-mvp
    rules:
      - alert: SearchFailureSpike
        expr: >
          sum(rate(bettermta_route_search_failures_total[5m]))
          /
          clamp_min(sum(rate(bettermta_route_search_total[5m])), 0.001)
          > 0.15
        for: 5m
        labels:
          severity: sev1
          service: api
        annotations:
          summary: Route search failure rate >15% over 5m
          runbook: docs/RUNBOOKS.md#elevated-routing-latency

      - alert: ApiSearchP95High
        expr: >
          histogram_quantile(
            0.95,
            sum by (le) (rate(bettermta_http_request_duration_seconds_bucket{route="/v1/routes/search"}[5m]))
          ) > 2
        for: 10m
        labels:
          severity: sev2
          service: api
        annotations:
          summary: Route search p95 latency >2s
          runbook: docs/RUNBOOKS.md#elevated-routing-latency

      - alert: RealtimeStale
        # Either feed age OR stale_duration exceeding 15m (DATA_CONTRACT)
        expr: >
          max(bettermta_realtime_age_seconds) > 900
          or
          max(bettermta_realtime_stale_duration_seconds) > 900
        for: 2m
        labels:
          severity: sev2
          service: data
        annotations:
          summary: Realtime snapshot age exceeds 15 minutes
          runbook: docs/RUNBOOKS.md#stale-realtime

      - alert: GeocoderFailureSpike
        expr: >
          sum(increase(bettermta_place_provider_errors_total{provider="geocoder"}[10m])) >= 5
          and
          sum(rate(bettermta_place_provider_errors_total{provider="geocoder"}[10m]))
          /
          clamp_min(sum(rate(bettermta_place_provider_total{provider="geocoder"}[10m])), 0.001)
          > 0.25
        for: 5m
        labels:
          severity: sev2
          service: api
        annotations:
          summary: Geocoder failure rate exceeds 25% with at least five failures
          runbook: docs/RUNBOOKS.md#geocoder-provider-outage

      - alert: ReadinessFailing
        expr: bettermta_health_ready == 0
        for: 3m
        labels:
          severity: sev1
          service: api
        annotations:
          summary: API readiness check failing
          runbook: docs/RUNBOOKS.md#rollback

      - alert: FrontendCrashSpike
        # Absolute crash-free ratio (MVP). Relative baseline (>5pp vs 24h / 2× errors)
        # remains a triage heuristic — see alerts.md.
        expr: bettermta_web_crash_free_session_ratio < 0.95
        for: 15m
        labels:
          severity: sev2
          service: web
        annotations:
          summary: Frontend crash-free session ratio below 95%
          runbook: docs/RUNBOOKS.md#broken-frontend-deploy

      # PLACEHOLDER: DeployFailure is event-driven (CI/CD / Fly webhook), not PromQL.
      # Wire when .github/workflows/deploy.yml is activated — see alerts.md L59-66.
      - alert: DeployFailure
        expr: bettermta_deploy_failure_events > 0
        for: 0m
        labels:
          severity: sev2
          service: deploy
          source: event-driven
          placeholder: "true"
        annotations:
          summary: Production deploy failed (Fly webhook or GitHub Actions deploy conclusion)
          runbook: docs/RUNBOOKS.md#rollback
          note: PLACEHOLDER stub — replace with webhook/CI annotation routing; not a live PromQL series
