# PLACEHOLDER — ready-to-activate when apps/api exists and ADR-0005 is accepted.
# App: bettermta-api (Fly.io)
#
# Health contract (locked):
#   GET /health/live  — process liveness
#   GET /health/ready — static OK + realtime OK or permitted degraded
#
# Activate:
#   fly apps create bettermta-api
#   fly secrets set -a bettermta-api --stage ...  # see infra/env/api/.env.example
#   fly deploy -a bettermta-api -c infra/fly/api.fly.toml
#
# One-action rollback:
#   fly releases rollback -a bettermta-api
#
# Staging variant: change app name / primary_region via fly.toml overrides or
#   fly deploy -a bettermta-api-staging -c infra/fly/api.fly.toml

app = 'bettermta-api'
primary_region = 'ewr'

[build]
  # PLACEHOLDER: point at apps/api Dockerfile once backend merges
  dockerfile = 'apps/api/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '8080'
  # Non-secret defaults only; secrets via `fly secrets`
  FLAG_DEFAULTS_PATH = '/app/config/flags.json'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 100
    soft_limit = 50

  # Liveness: process up
  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '20s'
    method = 'GET'
    path = '/health/live'

  # Readiness: do not route traffic if not ready
  [[http_service.checks]]
    interval = '15s'
    timeout = '5s'
    grace_period = '45s'
    method = 'GET'
    path = '/health/ready'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
  cpus = 1

[deploy]
  strategy = 'rolling'
