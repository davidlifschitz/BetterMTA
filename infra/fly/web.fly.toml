# PLACEHOLDER — ready-to-activate when apps/web exists and ADR-0005 is accepted.
# App: bettermta-web (Fly.io)
#
# Activate:
#   fly apps create bettermta-web
#   fly secrets set -a bettermta-web --stage ...
#   fly deploy -a bettermta-web -c infra/fly/web.fly.toml
#
# One-action rollback:
#   fly releases rollback -a bettermta-web

app = 'bettermta-web'
primary_region = 'ewr'

[build]
  # PLACEHOLDER: point at apps/web Dockerfile once frontend merges
  dockerfile = 'apps/web/Dockerfile'

[env]
  NODE_ENV = 'production'
  PORT = '3000'
  # Public API base URL set per environment (non-secret)
  # NEXT_PUBLIC_API_BASE_URL set via fly secrets or [env] per env

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 200
    soft_limit = 100

  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '30s'
    method = 'GET'
    path = '/'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
  cpus = 1

[deploy]
  strategy = 'rolling'
